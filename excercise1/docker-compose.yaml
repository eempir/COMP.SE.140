version: "3.9"
services:
  service1:
    build: ./service1-node
    container_name: svc_service1
    ports:
      - "8199:8199"       # Only external entrypoint
    environment:
      - STORAGE_URL=http://storage:8197
      - SERVICE2_URL=http://service2:8198/status
      - VSTORAGE_PATH=/vstorage
      - SERVICE1_PORT=8199
    depends_on:
      - service2
      - storage
    volumes:
      - ./vstorage:/vstorage

  service2:
    build: ./service2-python
    container_name: svc_service2
    environment:
      - STORAGE_URL=http://storage:8197
      - SERVICE2_PORT=8198
      - VSTORAGE_PATH=/vstorage
    expose:
      - "8198"
    depends_on:
      - storage
    volumes:
      - ./vstorage:/vstorage

  storage:
    build: ./storage
    container_name: svc_storage
    environment:
      - STORAGE_PORT=8197
      - STORAGE_DATA_FILE=/data/log.txt
    expose:
      - "8197"
    volumes:
      - storage-data:/data

volumes:
  storage-data: